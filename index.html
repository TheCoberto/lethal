<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lethal — How dangerous is this place?</title>
  <meta name="description" content="Pick any location and see its risk from natural disasters, wildlife, and crime.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>LETHAL</h1>
    <form id="search-form">
      <input id="search-input" type="search" placeholder="Search a place (e.g. Miami, FL)" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <div id="map"></div>
    <aside id="panel">
      <p class="hint">Click anywhere on the map or search for a place.</p>
    </aside>
  </main>

  <footer>
    Data: USGS, OpenStreetMap/Nominatim, curated wildlife data. Scores are relative estimates, not safety advice.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
